services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartfinance}
      POSTGRES_USER: ${DB_USER:-smart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smart123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smart} -d ${DB_NAME:-smartfinance}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
