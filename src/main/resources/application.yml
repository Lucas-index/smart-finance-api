spring:
  application:
    name: smart-finance-api

  # Banco padrão: H2 em arquivo (./data/smartfinance). Nada para instalar.
  datasource:
    url: jdbc:h2:file:./data/smartfinance;AUTO_SERVER=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true        # http://localhost:8080/h2-console  (JDBC URL acima, user sa, senha vazia)

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sem-chave}   # sem chave a API sobe, mas só os endpoints REST (sem IA) funcionam
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      audio:
        transcription:
          options:
            model: whisper-1
            language: pt
        speech:
          options:
            model: tts-1
            voice: alloy
            response-format: mp3
            speed: 1.0

server:
  port: 8080

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    com.smartapi: DEBUG
