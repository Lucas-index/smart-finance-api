spring:
  application:
    name: smart-finance-api

  # MySQL local. Crie o banco uma vez (veja o README) ou deixe o createDatabaseIfNotExist criar.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartfinance}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sem-chave}   # sem chave a API sobe, mas só os endpoints REST (sem IA) funcionam
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      audio:
        transcription:
          options:
            model: whisper-1
            language: pt
        speech:
          options:
            model: tts-1
            voice: alloy
            response-format: mp3
            speed: 1.0

server:
  port: 8080

app:
  auth:
    token-days: 7        # quantos dias o login fica válido

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    com.smartapi: DEBUG
